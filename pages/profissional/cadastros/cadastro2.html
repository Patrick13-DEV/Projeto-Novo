<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="../../../src/output.css" rel="stylesheet" />
    <title>Inova Vida Tech</title>
</head>

<body>
    <div class="min-h-screen bg-sky-300 flex items-end md:items-center justify-center">

                <!-- Card branco principal -->
        <div class="bg-white w-full md:max-w-7xl rounded-t-[2.5rem] md:rounded-[2.5rem] shadow-lg overflow-hidden">
            <div class="flex flex-col lg:flex-row">

                <div class="w-full lg:w-2/5 p-6 md:p-8 lg:p-10 flex flex-col justify-center items-center gap-5 lg:min-h-[778px]">

                    <h1 class="text-4xl lg:text-5xl font-poppins font-semibold text-center">Cadastre-se</h1>

                    <p class="text-gray-500 text-center text-sm">
                        Complete os dados abaixo para finalizar seu cadastro.
                    </p>

                    <div
                        class="border-2 border-gray-300 rounded-sm w-full max-w-md h-[76px] px-3 flex items-center gap-4">
                        <div class="bg-sky-800 size-[55px] rounded-lg flex items-center justify-center"></div>
                        <input class="flex-1 outline-none font-poppins" placeholder="Nome Completo">
                    </div>

                    <div
                        class="border-2 border-gray-300 rounded-sm w-full max-w-md h-[76px] px-3 flex items-center gap-4">
                        <div class="bg-sky-800 size-[55px] rounded-lg flex items-center justify-center"></div>
                        <input class="flex-1 outline-none font-poppins" placeholder="Email">
                    </div>

                    <div
                        class="border-2 border-gray-300 rounded-sm w-full max-w-md h-[76px] px-3 flex items-center gap-4">
                        <div class="bg-sky-800 size-[55px] rounded-lg flex items-center justify-center"></div>
                        <input class="flex-1 outline-none font-poppins" placeholder="Telefone">
                    </div>

                    <div class="w-full max-w-md flex gap-4">
                        <button class="flex-1 h-[76px] rounded-lg bg-sky-800 text-white font-poppins">Manhã</button>
                        <button class="flex-1 h-[76px] rounded-lg border font-poppins">Tarde</button>
                        <button class="flex-1 h-[76px] rounded-lg border font-poppins">Noite</button>
                    </div>

                    <div
                        class="w-full max-w-md h-[60px] rounded-full border-2 border-gray-300 flex items-center justify-center">
                        <p class="font-poppins text-center">Selecione o turno de atendimento</p>
                    </div>

                    <a href="./verificacao.html"
                        class="w-full max-w-md rounded-full bg-sky-800 py-4 text-center text-white font-semibold">Cadastrar</a>

                    <a href="./login.html" class="text-blue-500">Já tem uma conta? Faça login</a>

                </div>

                <div
                    class="hidden lg:flex lg:w-3/5 bg-gradient-to-br from-sky-100 to-cyan-400 items-center justify-center">
                    <img src="../../../assets/img/cadastro.png" class="w-full h-full object-cover" alt="Cadastro">
                </div>

            </div>
        </div>
    </div>
</body>

</html>
